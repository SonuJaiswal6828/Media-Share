<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Requests — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-5xl mx-auto w-full px-4 md:px-6 py-10">
    <div class="mb-10">
      <h1 class="text-4xl font-bold mb-2 text-white tracking-tight">Pending Requests</h1>
      <p class="text-gray-400">Approve or reject access requests from friends</p>
    </div>

    <div id="requestsList">
      <div class="space-y-3">
        <div class="h-24 bg-card border border-white/[0.06] rounded-2xl animate-pulse"></div>
        <div class="h-24 bg-card border border-white/[0.06] rounded-2xl animate-pulse"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    async function loadRequests() {
      try {
        const requests = await api.get("/access-request/pending");
        const list = document.getElementById("requestsList");

        if (requests.length === 0) {
          list.innerHTML = `
            <div class="bg-card border border-white/[0.06] rounded-2xl p-16 text-center">
              <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-green-600/10 border border-green-600/20 flex items-center justify-center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </div>
              <h3 class="text-xl font-semibold mb-2 text-white">All caught up</h3>
              <p class="text-gray-400">No pending requests right now</p>
            </div>`;
          return;
        }

        list.innerHTML = `<div class="space-y-3">
          ${requests.map(r => {
            const isExpired = new Date(r.expires_at + "Z") < new Date();
            return `
            <div class="bg-card border border-white/[0.06] rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4 ${isExpired ? 'opacity-50' : 'hover:border-purple-600/30'} transition-all">
              <div class="flex items-center gap-4 flex-1 min-w-0">
                <div class="w-12 h-12 rounded-xl ${isExpired ? 'bg-gray-600/20 border-gray-600/30' : 'bg-yellow-600/20 border-yellow-600/30'} border flex items-center justify-center flex-shrink-0">
                  ${isExpired 
                    ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
                    : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
                  }
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <h3 class="font-semibold text-white">${r.group_code}</h3>
                    <span class="text-xs px-2 py-0.5 rounded-full ${isExpired ? 'bg-gray-600/20 text-gray-400' : 'bg-yellow-600/20 text-yellow-400 border border-yellow-600/30'}">
                      ${isExpired ? 'expired' : 'pending'}
                    </span>
                  </div>
                  <p class="text-xs text-gray-500">Request code: <span class="font-mono text-gray-300">${r.request_code}</span></p>
                  <p class="text-xs text-gray-500 mt-0.5">${new Date(r.requested_at + "Z").toLocaleString()}</p>
                </div>
              </div>
              <div class="flex gap-2 flex-shrink-0">
                <button onclick="approveRequest(${r.id})" ${isExpired ? 'disabled' : ''}
                        class="px-5 py-2 rounded-lg text-sm font-medium transition ${isExpired
                          ? 'bg-white/[0.02] text-gray-600 cursor-not-allowed border border-white/[0.04]'
                          : 'bg-green-600/15 border border-green-600/40 text-green-400 hover:bg-green-600/25'}">
                  Approve
                </button>
                <button onclick="rejectRequest(${r.id})"
                        class="px-5 py-2 rounded-lg text-sm font-medium transition bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20">
                  Reject
                </button>
              </div>
            </div>
          `;
          }).join("")}
        </div>`;
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function approveRequest(id) {
      try {
        const session = await api.patch(`/access-request/${id}/approve`);
        showToast(`Session created · ${session.session_token.slice(0, 10)}...`, "success");
        loadRequests();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function rejectRequest(id) {
      if (!confirm("Reject this request?")) return;
      try {
        await api.patch(`/access-request/${id}/reject`);
        showToast("Request rejected", "success");
        loadRequests();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadRequests();
  </script>
</body>
</html>
