<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Section - PhotoShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-10">
    <a href="javascript:history.back()" class="text-sm text-gray-400 hover:text-purple-400 transition mb-6 inline-flex items-center gap-1">
      ← Back
    </a>

    <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
      <div>
        <h1 class="text-4xl font-bold mb-2 text-white">Section Content</h1>
        <p class="text-gray-400">Manage photos and documents</p>
      </div>
      <label id="uploadBtn" class="btn-primary flex items-center gap-2 cursor-pointer">
        <span class="text-lg">+</span>
        <span id="uploadLabel">Upload</span>
        <input type="file" id="fileInput" class="hidden" />
      </label>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-6 border-b border-border">
      <button onclick="switchTab('photos')" id="tab-photos"
              class="px-4 py-2 border-b-2 border-purple-600 text-purple-400 font-medium transition">
        🖼️ Photos
      </button>
      <button onclick="switchTab('documents')" id="tab-documents"
              class="px-4 py-2 border-b-2 border-transparent text-gray-400 hover:text-white transition">
        📄 Documents
      </button>
    </div>

    <!-- Progress -->
    <div id="progress" class="hidden bg-card border border-border rounded-xl p-4 mb-6">
      <p class="text-sm text-gray-300 mb-2" id="progressText">Uploading...</p>
      <div class="w-full bg-white/5 rounded-full h-2 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-purple-600 to-indigo-600 h-full transition-all" style="width: 0%"></div>
      </div>
    </div>

    <!-- Photos View -->
    <div id="photosView">
      <div class="spinner"></div>
    </div>

    <!-- Documents View -->
    <div id="documentsView" class="hidden">
      <div class="spinner"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    const params = new URLSearchParams(window.location.search);
    const sectionId = params.get("id");
    let activeTab = "photos";

    if (!sectionId) {
      window.location.href = "groups.html";
    }

    function switchTab(tab) {
      activeTab = tab;

      document.querySelectorAll('[id^="tab-"]').forEach(btn => {
        btn.classList.remove('border-purple-600', 'text-purple-400');
        btn.classList.add('border-transparent', 'text-gray-400');
      });
      document.getElementById(`tab-${tab}`).classList.add('border-purple-600', 'text-purple-400');
      document.getElementById(`tab-${tab}`).classList.remove('border-transparent', 'text-gray-400');

      document.getElementById('photosView').classList.toggle('hidden', tab !== 'photos');
      document.getElementById('documentsView').classList.toggle('hidden', tab !== 'documents');

      const fileInput = document.getElementById('fileInput');
      const uploadLabel = document.getElementById('uploadLabel');
      if (tab === 'photos') {
        fileInput.accept = 'image/*';
        uploadLabel.textContent = 'Upload Photo';
      } else {
        fileInput.accept = '.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.csv';
        uploadLabel.textContent = 'Upload Document';
      }
    }

    async function loadPhotos() {
      try {
        const photos = await api.get(`/section/${sectionId}/photos`);
        const container = document.getElementById("photosView");

        if (photos.length === 0) {
          container.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">🖼️</div>
              <h3 class="text-xl font-bold mb-2 text-white">No photos yet</h3>
              <p class="text-gray-400">Upload your first photo</p>
            </div>`;
          return;
        }

        container.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
          ${photos.map(p => `
            <div class="photo-card bg-card border border-border rounded-xl overflow-hidden group relative">
              <img src="${p.file_url}" alt="photo" class="w-full h-48 object-cover" />
              <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2">
                <a href="${p.file_url}" target="_blank" class="bg-white/20 text-white px-3 py-2 rounded-lg text-sm">🔍</a>
                <button onclick="deletePhoto(${p.id})" class="bg-red-500/80 text-white px-3 py-2 rounded-lg text-sm">🗑️</button>
              </div>
            </div>
          `).join("")}
        </div>`;
      } catch (err) {
        document.getElementById("photosView").innerHTML = `
          <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
            <p class="text-red-400">${err.message}</p>
          </div>`;
      }
    }

    async function deletePhoto(id) {
      if (!confirm("Delete this photo?")) return;
      try {
        await api.delete(`/photos/${id}`);
        showToast("Photo deleted", "success");
        loadPhotos();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    async function loadDocuments() {
      try {
        const docs = await api.get(`/documents/section/${sectionId}`);
        const container = document.getElementById("documentsView");

        if (docs.length === 0) {
          container.innerHTML = `
            <div class="bg-card border border-border rounded-2xl p-16 text-center">
              <div class="text-5xl mb-4">📄</div>
              <h3 class="text-xl font-bold mb-2 text-white">No documents yet</h3>
              <p class="text-gray-400">Upload your first document</p>
            </div>`;
          return;
        }

        container.innerHTML = `<div class="space-y-3">
          ${docs.map(d => {
            const sizeKB = d.file_size ? (d.file_size / 1024).toFixed(1) : "?";
            const ext = (d.file_format || "file").toUpperCase();
            return `
              <div class="bg-card border border-border rounded-xl p-5 flex items-center gap-4 hover:border-purple-600/50 transition">
                <div class="w-12 h-12 bg-blue-600/20 border border-blue-600/30 rounded-lg flex items-center justify-center text-xl flex-shrink-0">
                  📄
                </div>
                <div class="flex-1 min-w-0">
                  <p class="font-medium text-white truncate">${d.file_name}</p>
                  <p class="text-xs text-gray-500 mt-1">
                    ${ext} · ${sizeKB} KB · ${new Date(d.uploaded_at).toLocaleString()}
                  </p>
                </div>
                <a href="${d.file_url}" target="_blank" download
                   class="bg-purple-600/20 border border-purple-600/40 text-purple-300 hover:bg-purple-600/30 px-4 py-2 rounded-lg text-sm transition">
                  ⬇️ Download
                </a>
                <button onclick="deleteDocument(${d.id})"
                        class="bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 px-3 py-2 rounded-lg text-sm transition">
                  🗑️
                </button>
              </div>
            `;
          }).join("")}
        </div>`;
      } catch (err) {
        document.getElementById("documentsView").innerHTML = `
          <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
            <p class="text-red-400">${err.message}</p>
          </div>`;
      }
    }

    async function deleteDocument(id) {
      if (!confirm("Delete this document?")) return;
      try {
        await api.delete(`/documents/${id}`);
        showToast("Document deleted", "success");
        loadDocuments();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const progress = document.getElementById("progress");
      const bar = document.getElementById("progressBar");
      const text = document.getElementById("progressText");
      progress.classList.remove("hidden");
      bar.style.width = "10%";
      text.textContent = "Getting signature...";

      try {
        if (activeTab === "photos") {
          const sig = await api.get("/photos/get-upload-signature");
          bar.style.width = "30%";
          text.textContent = "Uploading...";

          const formData = new FormData();
          formData.append("file", file);
          formData.append("api_key", sig.api_key);
          formData.append("timestamp", sig.timestamp);
          formData.append("signature", sig.signature);

          const cloudRes = await fetch(
            `https://api.cloudinary.com/v1_1/${sig.cloud_name}/image/upload`,
            { method: "POST", body: formData }
          );
          const cloudData = await cloudRes.json();
          bar.style.width = "70%";

          await api.post("/photos/save_photo", {
            section_id: parseInt(sectionId),
            file_url: cloudData.secure_url,
          });

          bar.style.width = "100%";
          showToast("Photo uploaded!", "success");
          setTimeout(() => progress.classList.add("hidden"), 800);
          loadPhotos();

        } else {
          const sig = await api.get("/documents/get-upload-signature");
          bar.style.width = "30%";
          text.textContent = "Uploading...";

          const formData = new FormData();
          formData.append("file", file);
          formData.append("api_key", sig.api_key);
          formData.append("timestamp", sig.timestamp);
          formData.append("signature", sig.signature);

          const cloudRes = await fetch(
            `https://api.cloudinary.com/v1_1/${sig.cloud_name}/auto/upload`,
            { method: "POST", body: formData }
          );
          const cloudData = await cloudRes.json();
          bar.style.width = "70%";

          await api.post("/documents/save", {
            section_id: parseInt(sectionId),
            file_url: cloudData.secure_url,
            file_name: file.name,
            file_format: file.name.split('.').pop().toLowerCase(),
            file_size: file.size,
          });

          bar.style.width = "100%";
          showToast("Document uploaded!", "success");
          setTimeout(() => progress.classList.add("hidden"), 800);
          loadDocuments();
        }
      } catch (err) {
        showToast(err.message, "error");
        progress.classList.add("hidden");
      } finally {
        e.target.value = "";
      }
    });

    switchTab("photos");
    loadPhotos();
    loadDocuments();
  </script>
</body>
</html>
