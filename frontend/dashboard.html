<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 md:px-6 py-10">
    <!-- Header -->
    <div class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
      <div>
        <h1 class="text-4xl font-bold mb-2 text-white tracking-tight">Dashboard</h1>
        <p class="text-gray-400">Overview of your media sharing activity</p>
      </div>
      <a href="groups.html" class="btn-primary inline-flex items-center gap-2">
        <span>+</span> New Group
      </a>
    </div>

    <!-- Stats Grid -->
    <div id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
      <div class="bg-card border border-white/[0.06] rounded-2xl p-6 h-32 animate-pulse"></div>
      <div class="bg-card border border-white/[0.06] rounded-2xl p-6 h-32 animate-pulse"></div>
      <div class="bg-card border border-white/[0.06] rounded-2xl p-6 h-32 animate-pulse"></div>
    </div>

    <!-- Recent Groups -->
    <div class="bg-card border border-white/[0.06] rounded-2xl p-6 md:p-8 mb-6">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-lg font-semibold text-white">Recent Groups</h2>
          <p class="text-xs text-gray-500 mt-1">Your latest created groups</p>
        </div>
        <a href="groups.html" class="text-sm text-purple-400 hover:text-purple-300 transition font-medium">
          View all →
        </a>
      </div>
      <div id="recentGroups">
        <div class="space-y-3">
          <div class="h-16 bg-white/[0.02] rounded-xl animate-pulse"></div>
          <div class="h-16 bg-white/[0.02] rounded-xl animate-pulse"></div>
        </div>
      </div>
    </div>

    <!-- Recent Pending -->
    <div class="bg-card border border-white/[0.06] rounded-2xl p-6 md:p-8">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-lg font-semibold text-white">Pending Requests</h2>
          <p class="text-xs text-gray-500 mt-1">Awaiting your approval</p>
        </div>
        <a href="pending.html" class="text-sm text-purple-400 hover:text-purple-300 transition font-medium">
          View all →
        </a>
      </div>
      <div id="recentPending">
        <div class="space-y-3">
          <div class="h-16 bg-white/[0.02] rounded-xl animate-pulse"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    async function loadDashboard() {
      try {
        const [groups, pending] = await Promise.all([
          api.get("/group/"),
          api.get("/access-request/pending"),
        ]);

        // Stats
        document.getElementById("stats").innerHTML = `
          <div class="group relative overflow-hidden bg-card border border-white/[0.06] rounded-2xl p-6 hover:border-purple-600/40 transition-all">
            <div class="absolute top-0 right-0 w-32 h-32 bg-purple-600/[0.08] rounded-full blur-2xl"></div>
            <div class="relative flex items-start justify-between">
              <div>
                <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Total Groups</p>
                <p class="text-4xl font-bold text-white tracking-tight">${groups.length}</p>
                <p class="text-xs text-gray-500 mt-2">Across all sections</p>
              </div>
              <div class="w-11 h-11 rounded-xl bg-purple-600/20 border border-purple-600/30 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="group relative overflow-hidden bg-card border border-white/[0.06] rounded-2xl p-6 hover:border-yellow-600/40 transition-all">
            <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-600/[0.08] rounded-full blur-2xl"></div>
            <div class="relative flex items-start justify-between">
              <div>
                <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Pending</p>
                <p class="text-4xl font-bold text-white tracking-tight">${pending.length}</p>
                <p class="text-xs text-gray-500 mt-2">Awaiting approval</p>
              </div>
              <div class="w-11 h-11 rounded-xl bg-yellow-600/20 border border-yellow-600/30 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round">
                  <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="group relative overflow-hidden bg-card border border-white/[0.06] rounded-2xl p-6 hover:border-green-600/40 transition-all">
            <div class="absolute top-0 right-0 w-32 h-32 bg-green-600/[0.08] rounded-full blur-2xl"></div>
            <div class="relative flex items-start justify-between">
              <div>
                <p class="text-xs text-gray-500 uppercase tracking-wider mb-2">Status</p>
                <p class="text-4xl font-bold text-white tracking-tight">${groups.length > 0 ? "Active" : "—"}</p>
                <p class="text-xs text-gray-500 mt-2">System online</p>
              </div>
              <div class="w-11 h-11 rounded-xl bg-green-600/20 border border-green-600/30 flex items-center justify-center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
              </div>
            </div>
          </div>
        `;

        // Recent groups
        const recentGroups = document.getElementById("recentGroups");
        if (groups.length === 0) {
          recentGroups.innerHTML = `
            <div class="text-center py-12">
              <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-white/[0.04] border border-white/[0.08] flex items-center justify-center text-2xl">
                📁
              </div>
              <h3 class="text-lg font-semibold text-white mb-2">No groups yet</h3>
              <p class="text-sm text-gray-400 mb-6">Create your first group to start sharing media</p>
              <a href="groups.html" class="btn-primary inline-flex items-center gap-2">
                <span>+</span> Create Group
              </a>
            </div>`;
        } else {
          recentGroups.innerHTML = `
            <div class="space-y-2">
              ${groups.slice(0, 5).map(g => `
                <a href="group-detail.html?id=${g.id}" class="flex justify-between items-center p-4 rounded-xl hover:bg-white/[0.03] border border-transparent hover:border-white/[0.06] transition group">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-600/30 flex items-center justify-center text-base">
                      📁
                    </div>
                    <div>
                      <p class="font-medium text-white">${g.name}</p>
                      <p class="text-xs text-gray-500 mt-0.5">${new Date(g.created_at).toLocaleDateString()}</p>
                    </div>
                  </div>
                  <span class="text-xs text-gray-400 font-mono bg-white/[0.04] px-2.5 py-1 rounded border border-white/[0.06]">${g.group_code}</span>
                </a>
              `).join("")}
            </div>`;
        }

        // Recent pending
        const recentPending = document.getElementById("recentPending");
        if (pending.length === 0) {
          recentPending.innerHTML = `
            <div class="text-center py-12">
              <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-green-600/10 border border-green-600/20 flex items-center justify-center text-2xl">
                ✅
              </div>
              <h3 class="text-lg font-semibold text-white mb-2">All caught up</h3>
              <p class="text-sm text-gray-400">No pending requests right now</p>
            </div>`;
        } else {
          recentPending.innerHTML = `
            <div class="space-y-2">
              ${pending.slice(0, 5).map(r => `
                <a href="pending.html" class="flex justify-between items-center p-4 rounded-xl hover:bg-white/[0.03] border border-transparent hover:border-white/[0.06] transition">
                  <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-yellow-600/20 border border-yellow-600/30 flex items-center justify-center text-base">
                      ⏳
                    </div>
                    <div>
                      <p class="font-medium text-white">${r.group_code}</p>
                      <p class="text-xs text-gray-500 mt-0.5">Code: ${r.request_code}</p>
                    </div>
                  </div>
                  <span class="text-xs px-3 py-1 bg-yellow-600/20 border border-yellow-600/30 text-yellow-400 rounded-full font-medium">
                    pending
                  </span>
                </a>
              `).join("")}
            </div>`;
        }
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadDashboard();
  </script>
</body>
</html>
