<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Access — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 relative overflow-hidden flex items-center justify-center px-4 py-16">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(139,92,246,0.08),transparent_60%)]"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-purple-600/[0.06] rounded-full blur-[100px]"></div>

    <div class="relative w-full max-w-md">
      <div class="text-center mb-10">
        <div class="w-14 h-14 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-purple-900/40">
          🔓
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Request Access</h1>
        <p class="text-gray-400 text-sm">Enter the group code and password you received</p>
      </div>

      <div class="bg-card border border-white/[0.06] rounded-2xl p-8 backdrop-blur">
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>

        <form id="requestForm" class="space-y-5">
          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Group Code</label>
            <input type="text" id="groupCode" class="input-field font-mono uppercase tracking-wider" placeholder="e.g. ET8BXD" required />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Group Password</label>
            <input type="password" id="groupPassword" class="input-field" placeholder="Enter group password" required />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary w-full">
            Request Access
          </button>
        </form>

        <div id="success" class="hidden">
          <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-green-600/20 border border-green-600/30 flex items-center justify-center">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <h2 class="text-xl font-semibold text-white mb-1">Request Submitted</h2>
            <p class="text-sm text-gray-400">Save this code to check your status</p>
          </div>

          <div class="bg-bg border border-purple-600/30 rounded-xl p-6 mb-5 text-center">
            <p class="text-xs text-gray-500 mb-3 uppercase tracking-widest">Request Code</p>
            <p id="requestCodeDisplay" class="text-4xl font-bold text-purple-400 tracking-[0.3em] font-mono"></p>
          </div>

          <p class="text-xs text-gray-500 text-center mb-5">
            ⚠️ You'll need this code to check your request status
          </p>

          <a href="request-status.html" class="btn-primary w-full block text-center">
            Check Status
          </a>
        </div>
      </div>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have a request code?
        <a href="request-status.html" class="text-purple-400 hover:text-purple-300 font-medium transition">Check status</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    document.getElementById("requestForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errBox = document.getElementById("error");
      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Submitting...";

      try {
        const data = await api.post("/access-request/create", {
          group_code: document.getElementById("groupCode").value.trim(),
          group_password: document.getElementById("groupPassword").value,
        });

        document.getElementById("requestCodeDisplay").textContent = data.request_code;
        document.getElementById("requestForm").classList.add("hidden");
        document.getElementById("success").classList.remove("hidden");
        showToast("Request submitted", "success");
      } catch (err) {
        errBox.textContent = err.message || "Request failed";
        errBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Request Access";
      }
    });
  </script>
</body>
</html>
