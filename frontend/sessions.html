<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sessions — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 md:px-6 py-10">
    <div class="mb-10">
      <h1 class="text-4xl font-bold mb-2 text-white tracking-tight">Sessions</h1>
      <p class="text-gray-400">Manage active media access sessions</p>
    </div>

    <div id="stats" class="grid grid-cols-3 gap-4 mb-8"></div>

    <div id="sessionsList">
      <div class="space-y-3">
        <div class="h-32 bg-card border border-white/[0.06] rounded-2xl animate-pulse"></div>
        <div class="h-32 bg-card border border-white/[0.06] rounded-2xl animate-pulse"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();
    requireLogin();

    const statusStyles = {
      active:  { 
        bg: "bg-green-600/10", border: "border-green-600/30", text: "text-green-400", label: "Active",
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
      },
      expired: { 
        bg: "bg-gray-600/10",  border: "border-gray-600/30",  text: "text-gray-400",  label: "Expired",
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'
      },
      revoked: { 
        bg: "bg-red-600/10",   border: "border-red-600/30",   text: "text-red-400",   label: "Revoked",
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>'
      },
    };

    async function loadSessions() {
      try {
        const sessions = await api.get("/session/all");
        const list = document.getElementById("sessionsList");

        const counts = { active: 0, expired: 0, revoked: 0 };
        sessions.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);

        document.getElementById("stats").innerHTML = `
          <div class="bg-card border border-green-600/30 rounded-2xl p-5 text-center">
            <p class="text-3xl font-bold text-green-400 tracking-tight">${counts.active}</p>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider">Active</p>
          </div>
          <div class="bg-card border border-gray-600/30 rounded-2xl p-5 text-center">
            <p class="text-3xl font-bold text-gray-400 tracking-tight">${counts.expired}</p>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider">Expired</p>
          </div>
          <div class="bg-card border border-red-600/30 rounded-2xl p-5 text-center">
            <p class="text-3xl font-bold text-red-400 tracking-tight">${counts.revoked}</p>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider">Revoked</p>
          </div>
        `;

        if (sessions.length === 0) {
          list.innerHTML = `
            <div class="bg-card border border-white/[0.06] rounded-2xl p-16 text-center">
              <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-purple-600/10 border border-purple-600/20 flex items-center justify-center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </div>
              <h3 class="text-xl font-semibold mb-2 text-white">No sessions yet</h3>
              <p class="text-gray-400 mb-6">Approve a pending request to create your first session</p>
              <a href="pending.html" class="btn-primary inline-flex items-center gap-2">
                View Pending Requests
              </a>
            </div>`;
          return;
        }

        list.innerHTML = `
          <div class="space-y-3">
            ${sessions.map(s => {
              const style = statusStyles[s.status] || statusStyles.active;
              const created = new Date(s.created_at + "Z").toLocaleString();
              const expires = new Date(s.expire_time + "Z").toLocaleString();
              return `
                <div class="bg-card border border-white/[0.06] rounded-2xl p-5 hover:border-white/[0.12] transition">
                  <div class="flex flex-col md:flex-row md:items-start justify-between gap-4 mb-4">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-xl ${style.bg} ${style.border} border flex items-center justify-center">
                        ${style.icon}
                      </div>
                      <div>
                        <p class="font-semibold text-white">${s.group_name}</p>
                        <p class="text-xs text-gray-500 font-mono">${s.group_code}</p>
                      </div>
                    </div>
                    <span class="text-xs px-3 py-1 ${style.bg} ${style.border} border ${style.text} rounded-full font-medium self-start">
                      ${style.label}
                    </span>
                  </div>

                  <div class="grid grid-cols-2 gap-3 text-xs text-gray-500 mb-4">
                    <div>
                      <span class="text-gray-600 block mb-0.5">Request Code</span>
                      <span class="font-mono text-gray-300">${s.request_code}</span>
                    </div>
                    <div>
                      <span class="text-gray-600 block mb-0.5">Created</span>
                      <span class="text-gray-300">${created}</span>
                    </div>
                    <div>
                      <span class="text-gray-600 block mb-0.5">Expires</span>
                      <span class="text-gray-300">${expires}</span>
                    </div>
                    <div>
                      <span class="text-gray-600 block mb-0.5">Token</span>
                      <span class="font-mono text-gray-300 text-[10px]">${s.session_token.slice(0, 20)}...</span>
                    </div>
                  </div>

                  ${s.status === "active" ? `
                    <div class="flex justify-end pt-3 border-t border-white/[0.06]">
                      <button onclick="revokeSession(${s.id})"
                              class="px-4 py-2 rounded-lg text-sm font-medium transition bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20">
                        Revoke Access
                      </button>
                    </div>
                  ` : ''}
                </div>
              `;
            }).join("")}
          </div>
        `;
      } catch (err) {
        showToast(err.message, "error");
        document.getElementById("sessionsList").innerHTML = `
          <div class="bg-red-500/10 border border-red-500/30 rounded-2xl p-8 text-center">
            <p class="text-red-400 text-sm">${err.message}</p>
          </div>`;
      }
    }

    async function revokeSession(id) {
      if (!confirm("Revoke this session? The friend will lose access immediately.")) return;
      try {
        await api.patch(`/session/${id}/revoke`);
        showToast("Session revoked", "success");
        loadSessions();
      } catch (err) {
        showToast(err.message, "error");
      }
    }

    loadSessions();
  </script>
</body>
</html>
