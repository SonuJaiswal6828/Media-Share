<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check Status — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 relative overflow-hidden flex items-center justify-center px-4 py-16">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(139,92,246,0.08),transparent_60%)]"></div>

    <div class="relative w-full max-w-md">
      <div class="text-center mb-10">
        <div class="w-14 h-14 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-purple-900/40">
          🔍
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Check Status</h1>
        <p class="text-gray-400 text-sm">Enter your request code to view the status</p>
      </div>

      <div class="bg-card border border-white/[0.06] rounded-2xl p-8 backdrop-blur">
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>

        <form id="statusForm" class="space-y-5">
          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Request Code</label>
            <input type="text" id="requestCode" class="input-field text-center font-mono tracking-[0.3em] text-lg" placeholder="0000" required maxlength="10" />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary w-full">
            Check Status
          </button>
        </form>

        <div id="result" class="hidden mt-6 pt-6 border-t border-white/[0.06]"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    document.getElementById("statusForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errBox = document.getElementById("error");
      const result = document.getElementById("result");
      errBox.classList.add("hidden");
      result.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Checking...";

      try {
        const data = await api.get(`/access-request/status/${document.getElementById("requestCode").value.trim()}`);
        renderResult(data);
        result.classList.remove("hidden");
      } catch (err) {
        errBox.textContent = err.message || "Request not found";
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Check Status";
      }
    });

    function renderResult(data) {
      const result = document.getElementById("result");
      const statusStyles = {
        pending:  { bg: "bg-yellow-600/10", border: "border-yellow-600/30", text: "text-yellow-400", label: "Pending",  emoji: "⏳" },
        approved: { bg: "bg-green-600/10",  border: "border-green-600/30",  text: "text-green-400",  label: "Approved", emoji: "✅" },
        rejected: { bg: "bg-red-600/10",    border: "border-red-600/30",    text: "text-red-400",    label: "Rejected", emoji: "❌" },
        expired:  { bg: "bg-gray-600/10",   border: "border-gray-600/30",   text: "text-gray-400",   label: "Expired",  emoji: "⏰" },
      };
      const s = statusStyles[data.status] || statusStyles.pending;

      let html = `
        <div class="${s.bg} ${s.border} border rounded-xl p-5 text-center">
          <div class="text-3xl mb-2">${s.emoji}</div>
          <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Status</p>
          <p class="text-2xl font-bold ${s.text}">${s.label}</p>
        </div>
      `;

      if (data.status === "approved" && data.session_token) {
        html += `
          <div class="mt-5">
            <p class="text-xs text-gray-400 uppercase tracking-widest mb-2">Session Token</p>
            <div class="bg-bg border border-purple-600/30 rounded-lg p-3 mb-4">
              <p class="text-xs font-mono text-purple-300 break-all">${data.session_token}</p>
            </div>
            <a href="session-photos.html?token=${data.session_token}"
               class="btn-primary w-full block text-center">
              View Media
            </a>
          </div>
        `;
      }

      if (data.status === "pending") {
        html += `
          <p class="text-xs text-gray-500 text-center mt-4">
            Your request is pending admin approval. Check back later.
          </p>
        `;
      }

      result.innerHTML = html;
    }
  </script>
</body>
</html>
