<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 relative overflow-hidden flex items-center justify-center px-4 py-16">
    <!-- Background effects -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(139,92,246,0.08),transparent_60%)]"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-purple-600/[0.06] rounded-full blur-[100px]"></div>

    <div class="relative w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-10">
        <div class="w-14 h-14 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-purple-900/40">
          🔐
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Welcome back</h1>
        <p class="text-gray-400 text-sm">Sign in to your MediaShare account</p>
      </div>

      <!-- Card -->
      <div class="bg-card border border-white/[0.06] rounded-2xl p-8 backdrop-blur">
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Username</label>
            <input type="text" id="username" class="input-field" placeholder="Enter your username" required autocomplete="username" />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Password</label>
            <input type="password" id="password" class="input-field" placeholder="Enter your password" required autocomplete="current-password" />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary w-full">
            Sign In
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-white/[0.06]">
          <p class="text-center text-sm text-gray-400">
            Don't have an account?
            <a href="signup.html" class="text-purple-400 hover:text-purple-300 font-medium transition">Create one</a>
          </p>
        </div>
      </div>

      <!-- Footer note -->
      <p class="text-center text-xs text-gray-500 mt-6 flex items-center justify-center gap-1.5">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Protected with JWT authentication
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    if (isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("error");
      errorBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const data = await api.post("/admin/login", {
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        });
        setToken(data.access_token);
        showToast("Login successful", "success");
        setTimeout(() => window.location.href = "dashboard.html", 500);
      } catch (err) {
        errorBox.textContent = err.message || "Login failed";
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
