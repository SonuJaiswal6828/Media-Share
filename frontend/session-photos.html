<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shared Media — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 md:px-6 py-10">
    <div class="mb-10">
      <h1 class="text-4xl font-bold mb-2 text-white tracking-tight">Shared Media</h1>
      <p class="text-gray-400">Media you have temporary access to</p>
    </div>

    <div id="content">
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="aspect-square bg-card border border-white/[0.06] rounded-xl animate-pulse"></div>
        <div class="aspect-square bg-card border border-white/[0.06] rounded-xl animate-pulse"></div>
        <div class="aspect-square bg-card border border-white/[0.06] rounded-xl animate-pulse"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    clearToken(); // Friend view — clear any admin session
    renderNavbar();
    renderFooter();

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.getElementById("content").innerHTML = `
        <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
          <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-red-600/10 border border-red-600/20 flex items-center justify-center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          </div>
          <h3 class="text-xl font-semibold mb-2 text-white">No token provided</h3>
          <p class="text-gray-400 mb-6">You need a valid session token to view media</p>
          <a href="request-status.html" class="btn-primary inline-flex items-center gap-2">Check your status</a>
        </div>`;
    } else {
      loadPhotos();
    }

    async function loadPhotos() {
      try {
        const photos = await api.get(`/session/${token}/photos`);
        const content = document.getElementById("content");

        if (photos.length === 0) {
          content.innerHTML = `
            <div class="bg-card border border-white/[0.06] rounded-2xl p-16 text-center">
              <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-purple-600/10 border border-purple-600/20 flex items-center justify-center text-3xl">
                🖼️
              </div>
              <h3 class="text-xl font-semibold mb-2 text-white">No media available</h3>
              <p class="text-gray-400">This group has no content yet</p>
            </div>`;
          return;
        }

        content.innerHTML = `
          <div class="bg-green-600/5 border border-green-600/20 rounded-2xl p-4 mb-8 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-green-600/20 border border-green-600/30 flex items-center justify-center flex-shrink-0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
              </svg>
            </div>
            <div>
              <p class="font-medium text-white text-sm">Session Active</p>
              <p class="text-xs text-gray-400">${photos.length} item${photos.length !== 1 ? 's' : ''} · Expires in 1 hour</p>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            ${photos.map(p => `
              <div class="group relative aspect-square bg-card border border-white/[0.06] rounded-xl overflow-hidden hover:border-purple-600/40 transition-all">
                <img src="${p.file_url}" alt="media" class="w-full h-full object-cover" loading="lazy" />
                <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2">
                  <a href="${p.file_url}" target="_blank"
                     class="px-3 py-2 rounded-lg bg-white/10 backdrop-blur border border-white/20 text-white text-xs font-medium hover:bg-white/20 transition flex items-center gap-1.5">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                    View
                  </a>
                  <a href="${p.file_url}" download
                     class="px-3 py-2 rounded-lg bg-purple-600/80 backdrop-blur border border-purple-500/40 text-white text-xs font-medium hover:bg-purple-600 transition flex items-center gap-1.5">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                  </a>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      } catch (err) {
        document.getElementById("content").innerHTML = `
          <div class="bg-card border border-red-500/30 rounded-2xl p-16 text-center">
            <div class="w-16 h-16 mx-auto mb-5 rounded-2xl bg-red-600/10 border border-red-600/20 flex items-center justify-center">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            </div>
            <h3 class="text-xl font-semibold mb-2 text-white">Unable to load media</h3>
            <p class="text-gray-400 mb-6">${err.message}</p>
            <a href="request-status.html" class="btn-primary inline-flex items-center gap-2">Check your status</a>
          </div>`;
      }
    }
  </script>
</body>
</html>
