<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — MediaShare</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { bg: '#0a0a0a', card: '#141414', border: '#262626' }
      }}
    }
  </script>
</head>
<body class="bg-bg text-gray-100 min-h-screen flex flex-col font-sans antialiased">

  <div id="navbar"></div>

  <main class="flex-1 relative overflow-hidden flex items-center justify-center px-4 py-16">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(139,92,246,0.08),transparent_60%)]"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-purple-600/[0.06] rounded-full blur-[100px]"></div>

    <div class="relative w-full max-w-md">
      <div class="text-center mb-10">
        <div class="w-14 h-14 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-2xl shadow-lg shadow-purple-900/40">
          ✨
        </div>
        <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Create your account</h1>
        <p class="text-gray-400 text-sm">Get started with MediaShare in seconds</p>
      </div>

      <div class="bg-card border border-white/[0.06] rounded-2xl p-8 backdrop-blur">
        <div id="error" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-lg mb-5"></div>

        <form id="signupForm" class="space-y-5">
          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Username</label>
            <input type="text" id="username" class="input-field" placeholder="Choose a username" required minlength="3" autocomplete="username" />
            <p class="text-xs text-gray-500 mt-1.5">Minimum 3 characters</p>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Password</label>
            <input type="password" id="password" class="input-field" placeholder="Create a password" required minlength="6" autocomplete="new-password" />
            <p class="text-xs text-gray-500 mt-1.5">Minimum 6 characters</p>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Confirm Password</label>
            <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter your password" required minlength="6" autocomplete="new-password" />
          </div>

          <button type="submit" id="submitBtn" class="btn-primary w-full">
            Create Account
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-white/[0.06]">
          <p class="text-center text-sm text-gray-400">
            Already have an account?
            <a href="login.html" class="text-purple-400 hover:text-purple-300 font-medium transition">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script>
    renderNavbar();
    renderFooter();

    if (isLoggedIn()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errorBox = document.getElementById("error");
      const pwd = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      errorBox.classList.add("hidden");

      if (pwd !== confirm) {
        errorBox.textContent = "Passwords do not match";
        errorBox.classList.remove("hidden");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        await api.post("/admin/signup", {
          username: document.getElementById("username").value.trim(),
          password: pwd,
        });
        showToast("Account created. Please sign in.", "success");
        setTimeout(() => window.location.href = "login.html", 800);
      } catch (err) {
        errorBox.textContent = err.message || "Signup failed";
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
